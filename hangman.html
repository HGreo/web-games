<html>
    <head>
        <script src="hangmancode.js"></script>
        <link type="text/css" rel="stylesheet" href="hangmanstyle.css">   
        <link href="https://fonts.googleapis.com/css2?family=Lato:wght@900&family=Lora:ital@1&display=swap&family=Bebas+Neue&display=swap" rel="stylesheet">  
        <title>Wordle?</title>
        
    </head>
    <body onload="start();disablebuttons()">
        <h1>
            <a href="https://www.nytimes.com/games/wordle/index.html" id="realwordle" title="Visit the real Wordle!">Wordle?</a>
            <br>
            <a id="intro" href="https://en.wikipedia.org/wiki/Wordle" title="wikipedia">How to Play?</a>
        </h1>
        <div id="placeforstart"></div>
        <div id="display">Remaining Time: 5:00</div>
        <div id="guessings">     
        <table id="guessingtable">
            <tr id="firstRow" class="rows">
                <td class="guessingcells" id="row1cell1"> </td>
                <td class="guessingcells" id="row1cell2"> </td>
                <td class="guessingcells" id="row1cell3"> </td>
                <td class="guessingcells" id="row1cell4"> </td>
                <td class="guessingcells" id="row1cell5"> </td>
            </tr>
            <tr id="secondRow" class="rows">
                <td class="guessingcells" id="row2cell1"></td>
                <td class="guessingcells" id="row2cell2"></td>
                <td class="guessingcells" id="row2cell3"></td>
                <td class="guessingcells" id="row2cell4"></td>
                <td class="guessingcells" id="row2cell5"></td>
            </tr>
            <tr id="thirdRow" class="rows">
                <td class="guessingcells" id="row3cell1"></td>
                <td class="guessingcells" id="row3cell2"></td>
                <td class="guessingcells" id="row3cell3"></td>
                <td class="guessingcells" id="row3cell4"></td>
                <td class="guessingcells" id="row3cell5"></td>
            </tr>
            <tr id="forthRow" class="rows">
                <td class="guessingcells" id="row4cell1"></td>
                <td class="guessingcells" id="row4cell2"></td>
                <td class="guessingcells" id="row4cell3"></td>
                <td class="guessingcells" id="row4cell4"></td>
                <td class="guessingcells" id="row4cell5"></td>
            </tr>
            <tr id="fifthRow" class="rows">
                <td class="guessingcells" id="row5cell1"></td>
                <td class="guessingcells" id="row5cell2"></td>
                <td class="guessingcells" id="row5cell3"></td>
                <td class="guessingcells" id="row5cell4"></td>
                <td class="guessingcells" id="row5cell5"></td>
            </tr>
        </table>
    </div>
    <div id="keyboard">

            <div class="keyboardrows">
                <button id="Q" value="Q" onclick="fillin()" class="buttons">Q</button> <button value="W" onclick="fillin()" class="buttons" id="W">W</button> <button value="E" onclick="fillin()" class="buttons" id="E">E</button> <button value="R" onclick="fillin()" class="buttons" id="R">R</button> <button value="T" onclick="fillin()" class="buttons" id="T">T</button> <button value="Y" onclick="fillin()" class="buttons" id="Y">Y</button> <button value="U" onclick="fillin()" class="buttons" id="U">U</button> <button value="I" onclick="fillin()" class="buttons" id="I">I</button> <button value="O" onclick="fillin()" class="buttons" id="O">O</button> <button value="P" onclick="fillin()" class="buttons" id="P">P</button></td>
            </div>

            <div class="keyboardrows">
                <button value="A" onclick="fillin()" class="buttons" id="A">A</button> <button value="S" onclick="fillin()" class="buttons" id="S">S</button> <button value="D" onclick="fillin()" class="buttons" id="D">D</button> <button value="F" onclick="fillin()" class="buttons" id="F">F</button> <button value="G" onclick="fillin()" class="buttons" id="G">G</button> <button value="H" onclick="fillin()" class="buttons" id="H">H</button> <button value="J" onclick="fillin()" class="buttons" id="J">J</button> <button value="K" onclick="fillin()" class="buttons" id="K">K</button> <button value="L" onclick="fillin()" class="buttons" id="L">L</button>
            </div>

            <div class="keyboardrows">
                <button value="del" onclick="del()" class="buttons">DEL</button> <button value="Z" onclick="fillin()" class="buttons" id="Z">Z</button> <button value="X" onclick="fillin()" class="buttons" id="X">X</button> <button value="C" onclick="fillin()" class="buttons" id="C">C</button> <button value="V" onclick="fillin()" class="buttons" id="V">V</button> <button value="B" onclick="fillin()" class="buttons" id="B">B</button> <button value="N" onclick="fillin()" class="buttons" id="N">N</button> <button value="M" onclick="fillin()" class="buttons" id="M">M</button> <button value="enter" id="enter" onclick="enter();checkWin()" class="buttons">ENTER</button></td>
            </div>
    </div>
    <audio id="sound">
        <source src='http://commondatastorage.googleapis.com/codeskulptor-demos/DDR_assets/Kangaroo_MusiQue_-_The_Neverwritten_Role_Playing_Game.mp3'>
    </audio>
    <audio id="victory" preload="auto">
        <source src="http://www.mario-museum.net/sons/smb2_roulette-victoire.wav">
    </audio>
    <audio id="losing" preload="auto">
        <source src="http://www.dashingstrike.com/Automato/games/ATITD/sounds/fail.wav">
    </audio>
    </body>
</html>
