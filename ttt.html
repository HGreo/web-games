<html>
  <head>
    <script src="tttcode.js"></script>
    <link rel="stylesheet" type="text/css" href="tttstyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto+Slab:wght@500&display=swap" rel="stylesheet">
  </head>
  <body onload="start()">
    <div id="header">
      <h2>Tic Tac Toe</h2>
    </div>
    <div id="main">
      <table>
        <tr>
        <td><input type="button" class="buttons" id="button1" onclick="chooseSquare();checkWin()" value=" "></td>
        <td><input type="button" class="buttons" id="button2" onclick="chooseSquare();checkWin()" value=" "></td>
        <td><input type="button" class="buttons" id="button3" onclick="chooseSquare();checkWin()" value=" "></td>
        </tr>
        <tr>
          <td><input type="button" class="buttons" id="button4" onclick="chooseSquare();checkWin()" value=" "></td>
          <td><input type="button" class="buttons" id="button5" onclick="chooseSquare();checkWin()" value=" "></td>
          <td><input type="button" class="buttons" id="button6" onclick="chooseSquare();checkWin()" value=" "></td>
          </tr>
        <tr>
          <td><input type="button" class="buttons" id="button7" onclick="chooseSquare();checkWin()" value=" "></td>
          <td><input type="button" class="buttons" id="button8" onclick="chooseSquare();checkWin()" value=" "></td>
          <td><input type="button" class="buttons" id="button9" onclick="chooseSquare();checkWin()" value=" "></td>
        </tr>
      </table>
    </div>
    <div id="footer">
      Click to Play! Player X goes first!
    </div>
  </body>
</html>
